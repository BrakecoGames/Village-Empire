<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Preview</title>
<style>
  :root { --bg: #cde3e6; --fg: #3a2a1a; --panel: rgba(255,248,235,.92); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  #info { position: fixed; left: 12px; top: 12px; padding: 8px 12px; background: var(--panel); border-radius: 8px; white-space: pre; max-width: calc(100vw - 48px); overflow: auto; }
  select { font: inherit; margin-bottom: 6px; }
</style>
</head>
<body>
<!-- Zelfde Three.js-versie als de game (r128) + bijbehorende GLTFLoader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<div id="info">Laden…</div>
<script>
// Gebruik: http://127.0.0.1:4173/tools/blender/preview.html?model=test_cube
(function () {
  const q = new URLSearchParams(location.search);
  const name = q.get('model') || 'test_cube';
  const url = '../../public/models/' + name + '.glb';
  const info = document.getElementById('info');

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcde3e6);
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
  scene.add(new THREE.HemisphereLight(0xfff3dc, 0x5d7040, 0.7));
  const sun = new THREE.DirectionalLight(0xffe3b8, 0.9); sun.position.set(-4, 8, 5); sun.castShadow = true; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x8cc152 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  scene.add(new THREE.GridHelper(10, 10, 0x557733, 0x6f9940));

  let model = null, t = 0;
  new THREE.GLTFLoader().load(url, gltf => {
    model = gltf.scene;
    // ?node=house_l2 toont één node uit een GLB met meerdere varianten
    const only = q.get('node');
    if (only) { const n = model.getObjectByName(only); if (n) { model = new THREE.Group(); model.add(n); n.position.set(0, 0, 0); } }
    let meshes = 0, tris = 0;
    model.traverse(o => {
      if (!o.isMesh) return;
      meshes++; o.castShadow = o.receiveShadow = true;
      const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    });
    if (q.has('rot')) model.rotation.y = (+q.get('rot') || 0) * Math.PI / 180;   // ?rot=90 draait het model
    scene.add(model);
    const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
    const r = Math.max(size.x, size.y, size.z, 0.5);
    camera.position.set(r * 2.2, r * 1.8, r * 2.2); camera.lookAt(0, size.y / 2, 0);
    window.__modelResult = { ok: true, url, meshes, tris, size: size.toArray().map(v => +v.toFixed(3)), min: box.min.toArray().map(v => +v.toFixed(3)) };
    info.textContent = `${name}.glb${only ? ' · ' + only : ''}\n${meshes} mesh(es) · ${tris} tris\nmaat ${window.__modelResult.size.join(' × ')}`;
  }, undefined, err => {
    window.__modelResult = { ok: false, url, error: String(err && err.message || err) };
    info.textContent = 'Fout bij laden: ' + window.__modelResult.error;
  });

  addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  (function loop() {
    requestAnimationFrame(loop);
    if (model && !q.has('still')) { t += 0.01; model.rotation.y = t; }
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
